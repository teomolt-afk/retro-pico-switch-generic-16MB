name: Gemini Build Diagnoser

on:
  workflow_run:
    workflows: ["main.yml"] # Replace with the EXACT name of your build workflow
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  diagnose-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Fetch Failed Run Logs
        uses: actions/github-script@v7
        id: get-logs
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const logs = await github.rest.actions.downloadWorkflowRunLogs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run_id,
            });
            // Extracted log handling (truncated to stay within prompt token limits)
            core.setOutput("run_id", run_id);

      - name: Send Logs to Gemini & Post Comment
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            
            // 1. Fetch failure details from the run
            const runId = context.payload.workflow_run.id;
            const headSha = context.payload.workflow_run.head_sha;
            
            const prompt = `You are a DevOps and C++/CMake embedded systems expert. 
            The following GitHub Actions workflow failed. Analyze the build failure and provide:
            1. The exact root cause (1-2 sentences).
            2. The precise code or file fix required (e.g., changes to CMakeLists.txt or Dockerfile).
            
            Workflow Run ID: ${runId}`;

            // 2. Call Gemini 2.5 API
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [{ text: `${prompt}\n\nCommit SHA: ${headSha}` }]
                }]
              })
            });

            const data = await response.json();
            const aiAnalysis = data.candidates?.[0]?.content?.parts?.[0]?.text || "Gemini could not process the build logs.";

            // 3. Post Analysis as Commit Comment
            const commentBody = `### 🤖 Gemini Build Diagnosis\n\n${aiAnalysis}\n\n---\n*Automated diagnostic for run [#${runId}](${context.payload.workflow_run.html_url})*`;
            
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha,
              body: commentBody
            });
