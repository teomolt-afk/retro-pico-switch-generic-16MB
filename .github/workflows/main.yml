name: Build 16MB Pico Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install ARM Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake ninja-build

      - name: Set up Raspberry Pi Pico SDK
        uses: raspberrypi/pico-sdk-action@v1
        with:
          sdk-version: '1.5.1'

      - name: Configure CMake and Build
        run: |
          mkdir build
          cd build
          cmake -DPICO_BOARD=pico -DPICO_FLASH_SIZE_BYTES=16777216 ..
          make -j$(nproc)

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: pico-16mb-firmware
          path: build/*.uf2
