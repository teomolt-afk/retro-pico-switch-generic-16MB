name: Build 16MB Pico Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install ARM GCC Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib build-essential cmake ninja-build python3

      - name: Clone Raspberry Pi Pico SDK
        run: |
          git clone --recurse-submodules https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk

      - name: Configure CMake and Build (16MB Target)
        run: |
          mkdir build
          cd build
          cmake -DPICO_SDK_PATH=$HOME/pico-sdk -DPICO_BOARD=pico -DPICO_FLASH_SIZE_BYTES=16777216 ..
          make -j$(nproc)

      - name: Upload Built Firmware
        uses: actions/upload-artifact@v4
        with:
          name: pico-16mb-firmware
          path: build/*.uf2
