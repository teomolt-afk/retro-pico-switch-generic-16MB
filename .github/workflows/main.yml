name: Build 16MB Pico Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run Docker Container Build
        run: |
          docker build \
            --build-arg CMAKE_ARGS="-DPICO_BOARD=pico -DPICO_FLASH_SIZE_BYTES=16777216" \
            --output=./output .

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pico-16mb-firmware
          path: ./output/*.uf2
