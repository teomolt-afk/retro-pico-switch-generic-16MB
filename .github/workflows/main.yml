name: Build 16MB Pico Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install ARM GCC Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib build-essential cmake ninja-build python3

      - name: Build Firmware
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pico-16mb-firmware
          path: build/*.uf2
